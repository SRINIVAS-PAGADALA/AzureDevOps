name: Build and Push Weather Dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'weather-dashboard/**'
      - '.github/workflows/weather-dashboard.yml'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name weatheracr1

      - name: Build Docker image
        run: docker build -t weatheracr1.azurecr.io/weather-dashboard:latest ./weather-dashboard

      - name: Push Docker image to ACR
        run: docker push weatheracr1.azurecr.io/weather-dashboard:latest

      - name: Create artifact
        run: echo "Weather Dashboard build completed" > build-info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-dashboard-build
          path: build-info.txt
