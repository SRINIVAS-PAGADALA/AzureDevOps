name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t incidentplatformacr.azurecr.io/incident-service-management:${{ github.sha }} \
            .

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name incidentplatformacr

      - name: Push Docker image
        run: |
          docker push incidentplatformacr.azurecr.io/incident-service-management:${{ github.sha }}

      - name: Update Kubernetes manifest
        run: |
          sed -i "s|image: .*|image: incidentplatformacr.azurecr.io/incident-service-management:${{ github.sha }}|" k8s-deployment.yaml

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg1 \
            --name incident-aks \
            --overwrite-existing

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s-deployment.yaml
          kubectl apply -f k8s-service.yaml